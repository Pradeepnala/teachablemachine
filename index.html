<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cat or Dog AI</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>

    <!-- Teachable Machine Image Library -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #imageUpload {
            display: none;
        }

        #preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 25px;
            border-radius: 15px;
            display: none;
        }

        #status {
            margin-top: 20px;
            color: #666;
        }

        #prediction {
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        #confidence {
            margin-top: 10px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🐱 Cat or Dog AI 🐶</h1>

        <p class="subtitle">
            Upload an image and let the AI classify it.
        </p>

        <button onclick="document.getElementById('imageUpload').click()">
            📷 Choose Image
        </button>

        <input
            type="file"
            id="imageUpload"
            accept="image/*"
        >

        <br>

        <img id="preview" alt="Uploaded image">

        <div id="status">
            Loading AI model...
        </div>

        <div id="prediction"></div>

        <div id="confidence"></div>

    </div>


    <script>

        // ------------------------------------------------
        // YOUR TEACHABLE MACHINE MODEL
        // ------------------------------------------------

        const MODEL_URL =
            "https://teachablemachine.withgoogle.com/models/a68thKGSg/";


        let model;


        // ------------------------------------------------
        // LOAD MODEL
        // ------------------------------------------------

        async function loadModel() {

            const modelURL =
                MODEL_URL + "model.json";

            const metadataURL =
                MODEL_URL + "metadata.json";


            document.getElementById("status").innerText =
                "Loading AI model...";


            try {

                model = await tmImage.load(
                    modelURL,
                    metadataURL
                );


                document.getElementById("status").innerText =
                    "✅ AI model ready! Choose an image.";

            }

            catch (error) {

                document.getElementById("status").innerText =
                    "❌ Could not load the AI model.";

                console.error(error);

            }

        }


        // ------------------------------------------------
        // IMAGE UPLOAD
        // ------------------------------------------------

        document
            .getElementById("imageUpload")
            .addEventListener("change", function(event) {


                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                const image =
                    document.getElementById("preview");


                image.src =
                    URL.createObjectURL(file);


                image.style.display =
                    "block";


                image.onload = function() {

                    predict(image);

                };

            });


        // ------------------------------------------------
        // PREDICTION
        // ------------------------------------------------

        async function predict(image) {


            document.getElementById("status").innerText =
                "🤖 AI is analyzing the image...";


            const predictions =
                await model.predict(image);


            // Find class with highest probability

            let bestPrediction =
                predictions[0];


            for (
                let i = 1;
                i < predictions.length;
                i++
            ) {

                if (
                    predictions[i].probability >
                    bestPrediction.probability
                ) {

                    bestPrediction =
                        predictions[i];

                }

            }


            const className =
                bestPrediction.className;


            const confidence =
                (
                    bestPrediction.probability * 100
                ).toFixed(2);


            // Display result

            document.getElementById("prediction").innerText =
                "Prediction: " + className;


            document.getElementById("confidence").innerText =
                "Confidence: " + confidence + "%";


            document.getElementById("status").innerText =
                "✅ Prediction complete!";

        }


        // ------------------------------------------------
        // START
        // ------------------------------------------------

        loadModel();

    </script>

</body>

</html>
